<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jev Twitter Ads Blocker Settings</title>
  </head>
  <body>
    <h1>Settings</h1>
    <label>TypeSafe API key: <input type="password" id="apiKey" size="40" /></label>
    <br />
    <label>Hide threshold: <input type="number" id="hide" min="0" max="1" step="0.05" /></label>
    <br />
    <label>Blur threshold: <input type="number" id="blur" min="0" max="1" step="0.05" /></label>
    <br />
    <button id="save">Save</button>
    <span id="status"></span>
    <script src="options.js"></script>
  </body>
</html>
